[project]
name = "pmll"
version = "0.1.0"
description = "Do prediction markets lead conventional markets on geopolitical events? Lead-lag pipeline."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pyarrow>=12",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
data = ["databento>=0.30"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
